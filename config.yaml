    - principal
    - manager
    - teaching
    - quality engineer*
    - test engineer*
    - student researcher
    - content writ*
    - video
    - social media
    - customer support
    - telecaller
  # "Frontend" is fine if the role is also full stack
  frontend_ok_if: ["full stack", "full-stack", "fullstack"]

# Things that mark a listing as dodgy (mostly for Internshala)
scam_filters:
  - registration fee
  - training fee
  - security deposit
  - pay to
  - paid training
  - certificate fee
  - investment required

us_work_authorization:
  # You're legally authorised to work in the US and willing to relocate, so
  # "Does Not Offer Sponsorship" roles are always INCLUDED (shown with a small tag).
  # Citizenship-only roles (often defense/government) are also included and tagged.
  # Set this to true if you want those dropped.
  drop_citizenship_required: false

