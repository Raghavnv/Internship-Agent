# ─────────────────────────────────────────────────────────────
#  Raghav's internship alert agent: preferences
#  Edit this file on GitHub any time; the next run picks it up.
# ─────────────────────────────────────────────────────────────

profile:
  name: Raghav Venkat
  # Pulled from your resume. Used to rank matches and explain why a role fits.
  skills: [python, java, c, javascript, fastapi, rest, postgresql, mysql, react,
           pytorch, xgboost, yolo, computer vision, llm, rag, chromadb, machine learning,
           ai, backend, full stack, deployment, forward deployed]

# Which internship windows work for you
windows:
  # Onsite / hybrid: only summer (June–September 2027)
  onsite_terms: ["Summer 2027"]
  # Remote: anything that overlaps January–June 2027 or the summer
  remote_terms: ["Winter 2027", "Spring 2027", "Summer 2027"]
  # Listings with no stated term are kept only if posted within this many days
  undated_max_age_days: 45

locations:
  # Instant alerts for these (US metros you named + Bangalore)
  preferred:
    - austin
    - round rock
    - dallas
    - irving
    - plano
    - frisco
    - richardson
    - houston
    - sugar land
    - the woodlands
    # Bay Area
    - sf
    - san francisco
    - bay area
    - san jose
    - santa clara
    - sunnyvale
    - mountain view
    - palo alto
    - menlo park
    - cupertino
    - redwood city
    - san mateo
    - foster city
    - fremont
    - milpitas
    - oakland
    - berkeley
    - emeryville
    - south san francisco
    # India
    - bangalore
    - bengaluru
  # Remote roles are always considered (only the term rules above apply)
  include_remote: true
  # Other US cities (NYC, Seattle, ...) go to the daily digest instead of instant alerts.
  # Set to false to drop them entirely.
  other_us_in_digest: true
  # Other Indian cities (Hyderabad, Pune, ...) go to the daily digest
  other_india_in_digest: true

roles:
  # Whole-word matches, case-insensitive. A trailing * means "starts with" (data scien* = data science/scientist).
  # A title must contain at least one of these to count
  include_keywords:
    - software
    - swe
    - sde
    - developer
    - backend
    - back-end
    - back end
    - full stack
    - full-stack
    - fullstack
    - machine learning
    - ml
    - ml engineer
    - ai
    - artificial intelligence
    - deep learning
    - llm
    - genai
    - generative
    - nlp
    - computer vision
    - data scien*
    - applied scien*
    - research engineer
    - research intern
    - data engineer*
    - foundation model*
    - reinforcement learning
    - robotics software
    - automation engineer*
    - quantitative develop*
    - research scientist
    - forward deploy*
    - platform
    - infrastructure
