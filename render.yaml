# Render blueprint for the Internship Copilot API (app/backend).
# Render dashboard -> New -> Blueprint -> pick this repo. You'll be asked for the secret values.
services:
  - type: web
    name: internship-copilot-api
    runtime: python
    plan: free
    rootDir: app/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      # two-way WhatsApp (optional): see "Talk to your agent" in README.md
      - key: META_WA_TOKEN
        sync: false
      - key: META_WA_PHONE_NUMBER_ID
        sync: false
      - key: META_WA_TO
        sync: false
      - key: META_WA_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
