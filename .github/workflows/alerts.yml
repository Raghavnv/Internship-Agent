name: Internship alerts

on:
  schedule:
    # Every 15 minutes. If your repo is PRIVATE, change to "*/30 * * * *" to stay inside
    # GitHub's free 2,000 minutes/month. Public repos have unlimited free minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = normal check, test = send a test WhatsApp message, digest = send digest now"
        default: run
        type: choice
        options: [run, test, digest]

permissions:
  contents: write

concurrency:
  group: internship-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check for new internships
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          META_WA_TOKEN: ${{ secrets.META_WA_TOKEN }}
          META_WA_PHONE_NUMBER_ID: ${{ secrets.META_WA_PHONE_NUMBER_ID }}
          META_WA_TO: ${{ secrets.META_WA_TO }}
          META_WA_WABA_ID: "2498335370676576"
          META_WA_TEMPLATE_LANG: ${{ secrets.META_WA_TEMPLATE_LANG || 'en' }}
          AISENSY_API_KEY: ${{ secrets.AISENSY_API_KEY }}
          AISENSY_JOB_CAMPAIGN: ${{ secrets.AISENSY_JOB_CAMPAIGN }}
          AISENSY_TEXT_CAMPAIGN: ${{ secrets.AISENSY_TEXT_CAMPAIGN }}
          AISENSY_DESTINATION: ${{ secrets.AISENSY_DESTINATION }}
        run: |
          MODE="${{ github.event.inputs.mode || 'run' }}"
          if [ "$MODE" = "test" ]; then python -m agent.main --test
          elif [ "$MODE" = "digest" ]; then python -m agent.main --digest
          else python -m agent.main; fi
      - name: Save state
        if: ${{ github.event.inputs.mode != 'test' }}
        run: |
          git config user.name "internship-bot"
          git config user.email "internship-bot@users.noreply.github.com"
          git add -A state MATCHES.md STATUS.md 2>/dev/null || true
          git diff --staged --quiet || git commit -m "update seen jobs [skip ci]"
          git pull --rebase -X ours || true
          git push
